<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Will you be my Valentine?</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg1: #ffd6e7;
      --bg2: #ffeef6;
      --card: #ffffffcc;
      --yes: #ff3b7a;
      --yesHover: #ff1f68;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      padding: 16px;
    }

    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 10;
    }

    .card {
      position: relative;
      z-index: 20;
      width: min(720px, 92vw);
      padding: 30px 22px;
      background: var(--card);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 18px 60px rgba(0,0,0,.12);
    }

    .art {
      width: min(240px, 70vw);
      margin: 0 auto 10px;
      display: block;
      filter: drop-shadow(0 10px 14px rgba(0,0,0,.1));
    }

    /* HEARTBEAT ANIMATION */
    #mainHeart {
      transform-origin: center;
      transform-box: fill-box;
      animation: heartbeat 1.2s infinite ease-in-out;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    h1 {
      font-size: clamp(24px, 5vw, 42px);
      margin: 12px 0 20px;
      color: #333;
      font-weight: 800;
    }

    .button-zone {
      position: relative;
      width: 100%;
      height: 160px;
      margin: 0 auto;
      touch-action: none; 
    }

    button {
      position: absolute;
      padding: 16px 32px;
      font-size: 20px;
      font-weight: 800;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,.15);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .15s cubic-bezier(0.175, 0.885, 0.32, 1.275), background .12s ease;
    }

    #yesBtn {
      left: 15%;
      top: 50%;
      transform: translateY(-50%);
      background: var(--yes);
      color: #fff;
    }

    #noBtn {
      left: 65%;
      top: 50%;
      transform: translateY(-50%);
      background: #e5e7eb;
      color: #374151;
      transition: left 0.2s ease-out, top 0.2s ease-out;
    }

    .hint {
      margin-top: 15px;
      font-size: 14px;
      font-weight: 500;
      color: #666;
      opacity: 0.8;
    }

    .result {
      display: none;
      margin-top: 10px;
      animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .result h2 {
      font-size: clamp(32px, 6vw, 50px);
      color: var(--yes);
      margin-bottom: 20px;
    }

    .fireworks {
      width: 100%;
      max-width: 400px;
      border-radius: 16px;
    }

    @keyframes pop {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>

<body>
  <canvas id="confettiCanvas"></canvas>

  <main class="card">
    <svg class="art" viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="fur" x1="0" x2="1">
          <stop offset="0" stop-color="#f7c7a1"/>
          <stop offset="1" stop-color="#f2a97b"/>
        </linearGradient>
        <linearGradient id="heart" x1="0" x2="1">
          <stop offset="0" stop-color="#ff4d7d"/>
          <stop offset="1" stop-color="#ff1f68"/>
        </linearGradient>
      </defs>
      <path id="mainHeart" d="M250 50 C250 33 270 25 282 38 C294 25 314 33 314 50 C314 78 282 92 282 106 C282 92 250 78 250 50Z" fill="url(#heart)"/>
      <path d="M90 120 C90 70 140 40 190 60 C240 40 290 70 290 120 C290 180 240 210 190 210 C140 210 90 180 90 120Z" fill="url(#fur)"/>
      <path d="M110 92 L95 55 L140 78 Z" fill="#f2a97b"/>
      <path d="M270 92 L285 55 L240 78 Z" fill="#f2a97b"/>
      <circle cx="160" cy="130" r="8" fill="#333"/>
      <circle cx="220" cy="130" r="8" fill="#333"/>
      <path d="M190 144 C186 144 182 148 182 152 C182 160 190 164 190 170 C190 164 198 160 198 152 C198 148 194 144 190 144Z" fill="#ff7aa2"/>
    </svg>

    <h1>Nonuuuu, will you be my valentine?</h1>

    <section class="button-zone" id="zone">
      <button id="yesBtn">Yes</button>
      <button id="noBtn" aria-hidden="true">No</button>
    </section>

    <div class="hint" id="hint">“No” seems a bit shy 😈</div>

    <section class="result" id="result">
      <h2>YAY! 🎉</h2>
      <img class="fireworks" src="https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif" alt="Celebration Fireworks" />
    </section>
  </main>

  <script>
    const zone = document.getElementById("zone");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const result = document.getElementById("result");
    const hint = document.getElementById("hint");
    const confettiCanvas = document.getElementById("confettiCanvas");

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      confettiCanvas.width = window.innerWidth * dpr;
      confettiCanvas.height = window.innerHeight * dpr;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    const confettiInstance = confetti.create(confettiCanvas, { resize: false });

    function fireConfetti() {
      const end = Date.now() + 2500;
      (function frame() {
        confettiInstance({
          particleCount: 8,
          spread: 70,
          origin: { x: Math.random(), y: Math.random() - 0.2 },
          colors: ['#ff3b7a', '#ff9fbc', '#ffffff']
        });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();
    }

    let yesScale = 1;

    function moveNo(mouseX, mouseY) {
      const zoneRect = zone.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();
      const btnCenterX = btnRect.left + btnRect.width / 2;
      const btnCenterY = btnRect.top + btnRect.height / 2;

      let dx = btnCenterX - mouseX;
      let dy = btnCenterY - mouseY;
      let dist = Math.hypot(dx, dy) || 1;

      const fleePower = 140; 
      let nextLeft = (btnRect.left - zoneRect.left) + (dx / dist) * fleePower;
      let nextTop = (btnRect.top - zoneRect.top) + (dy / dist) * fleePower;

      const pad = 15;
      nextLeft = Math.max(pad, Math.min(nextLeft, zoneRect.width - btnRect.width - pad));
      nextTop = Math.max(pad, Math.min(nextTop, zoneRect.height - btnRect.height - pad));

      noBtn.style.left = nextLeft + "px";
      noBtn.style.top = nextTop + "px";
      noBtn.style.transform = "none";

      yesScale = Math.min(3, yesScale + 0.15);
      yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;
    }

    zone.addEventListener("pointermove", (e) => {
      const btnRect = noBtn.getBoundingClientRect();
      const dist = Math.hypot((btnRect.left + btnRect.width / 2) - e.clientX, (btnRect.top + btnRect.height / 2) - e.clientY);
      if (dist < 100) moveNo(e.clientX, e.clientY);
    });

    noBtn.addEventListener("click", (e) => e.preventDefault());

    yesBtn.addEventListener("click", () => {
      zone.style.display = "none";
      hint.style.display = "none";
      result.style.display = "block";
      fireConfetti();
    });
  </script>
</body>
</html>
