<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Stay stuck with me?</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg1: #ffd6e7;
      --bg2: #ffeef6;
      --card: #ffffffcc;
      --yes: #ff3b7a;
      --yesHover: #ff1f68;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      padding: 16px;
    }

    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 10;
    }

    .card {
      position: relative;
      z-index: 20;
      width: min(720px, 92vw);
      padding: 30px 22px;
      background: var(--card);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 18px 60px rgba(0,0,0,.12);
    }

    .art {
      width: min(240px, 70vw);
      margin: 0 auto 10px;
      display: block;
      filter: drop-shadow(0 10px 14px rgba(0,0,0,.1));
    }

    /* HEARTBEAT ANIMATION */
    #mainHeart {
      transform-origin: center;
      transform-box: fill-box;
      animation: heartbeat 1.2s infinite ease-in-out;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    h1 {
      font-size: clamp(22px, 4.5vw, 38px);
      margin: 12px 0 20px;
      color: #333;
      font-weight: 800;
      line-height: 1.3;
    }

    .button-zone {
      position: relative;
      width: 100%;
      height: 160px;
      margin: 0 auto;
      touch-action: none; 
    }

    button {
      position: absolute;
      padding: 16px 32px;
      font-size: 20px;
      font-weight: 800;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,.15);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .15s cubic-bezier(0.175, 0.885, 0.32, 1.275), background .12s ease;
    }

    #yesBtn {
      left: 15%;
      top: 50%;
      transform: translateY(-50%);
      background: var(--yes);
      color: #fff;
    }

    #noBtn {
      left: 65%;
      top: 50%;
      transform: translateY(-50%);
      background: #e5e7eb;
      color: #374151;
      transition: left 0.2s ease-out, top 0.2s ease-out;
    }

    .preview-box {
      margin-top: 10px;
      height: 180px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .preview-gif {
      max-height: 100%;
      max-width: 300px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,.1);
      display: none;
    }

    .hint {
      margin-top: 15px;
      font-size: 15px;
      font-weight: 600;
      color: #ff3b7a;
      min-height: 24px;
      transition: opacity 0.2s ease;
    }

    .result {
      display: none;
      margin-top: 10px;
      animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .result h2 {
      font-size: clamp(32px, 6vw, 50px);
      color: var(--yes);
      margin-bottom: 20px;
    }

    .celebration-gif {
      width: 100%;
      max-width: 360px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(255, 59, 122, 0.25);
    }

    @keyframes pop {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>

<body>
  <canvas id="confettiCanvas"></canvas>

  <main class="card">
    <div id="quizContent">
      <svg class="art" viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="fur" x1="0" x2="1">
            <stop offset="0" stop-color="#f7c7a1"/>
            <stop offset="1" stop-color="#f2a97b"/>
          </linearGradient>
          <linearGradient id="heart" x1="0" x2="1">
            <stop offset="0" stop-color="#ff4d7d"/>
            <stop offset="1" stop-color="#ff1f68"/>
          </linearGradient>
        </defs>
        <path id="mainHeart" d="M250 50 C250 33 270 25 282 38 C294 25 314 33 314 50 C314 78 282 92 282 106 C282 92 250 78 250 50Z" fill="url(#heart)"/>
        <path d="M90 120 C90 70 140 40 190 60 C240 40 290 70 290 120 C290 180 240 210 190 210 C140 210 90 180 90 120Z" fill="url(#fur)"/>
        <path d="M110 92 L95 55 L140 78 Z" fill="#f2a97b"/>
        <path d="M270 92 L285 55 L240 78 Z" fill="#f2a97b"/>
        <circle cx="160" cy="130" r="8" fill="#333"/>
        <circle cx="220" cy="130" r="8" fill="#333"/>
        <path d="M190 144 C186 144 182 148 182 152 C182 160 190 164 190 170 C190 164 198 160 198 152 C198 148 194 144 190 144Z" fill="#ff7aa2"/>
      </svg>

      <h1>Kucchu Pucchu, would you love to stay stuck with me forever? 🧲❤️</h1>

      <section class="button-zone" id="zone">
        <button id="yesBtn">Yes!</button>
        <button id="noBtn" aria-hidden="true">No</button>
      </section>

      <!-- Steve Carell preview image on hover -->
      <div class="preview-box">
        <img id="hoverGif" class="preview-gif" src="https://media.giphy.com/media/huJmPXfeir5JlpPAx3/giphy.gif" alt="Steve Carell It's Happening!" />
      </div>

      <div class="hint" id="hint">Pro tip: "No" is allergic to cursor clicks 😜</div>
    </div>

    <section class="result" id="result">
      <h2>YAYYYY! BEST DECISION EVER! 🎉🙌</h2>
      <img class="celebration-gif" src="https://media.giphy.com/media/5GoVLqeAOo6PK/giphy.gif" alt="Crazy Excited Yay Reaction" />
    </section>
  </main>

  <script>
    const zone = document.getElementById("zone");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const quizContent = document.getElementById("quizContent");
    const result = document.getElementById("result");
    const hint = document.getElementById("hint");
    const hoverGif = document.getElementById("hoverGif");
    const confettiCanvas = document.getElementById("confettiCanvas");

    const quirkyHints = [
      "Nice try! That button has zero stamina 🏃‍♂️💨",
      "Error 404: 'No' option unavailable 🚫",
      "You're stuck with me, accept your destiny! ✨",
      "Are your fingers slipping, or is 'Yes' just looking extra fine? 😏",
      "I put superglue on the 'Yes' button anyway! 🧪",
      "The universe has already chosen for you 🌌",
      "Resistance is futile, Kucchu Pucchu! 🛸",
      "Look how big 'Yes' is getting... just hit it! 👀"
    ];

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      confettiCanvas.width = window.innerWidth * dpr;
      confettiCanvas.height = window.innerHeight * dpr;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    const confettiInstance = confetti.create(confettiCanvas, { resize: false });

    function fireConfetti() {
      const end = Date.now() + 2500;
      (function frame() {
        confettiInstance({
          particleCount: 8,
          spread: 70,
          origin: { x: Math.random(), y: Math.random() - 0.2 },
          colors: ['#ff3b7a', '#ff9fbc', '#ffffff']
        });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();
    }

    let yesScale = 1;
    let hintIndex = 0;

    function updateQuirkyHint() {
      hint.innerText = quirkyHints[hintIndex];
      hintIndex = (hintIndex + 1) % quirkyHints.length;
    }

    function moveNo(mouseX, mouseY) {
      const zoneRect = zone.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();
      const btnCenterX = btnRect.left + btnRect.width / 2;
      const btnCenterY = btnRect.top + btnRect.height / 2;

      let dx = btnCenterX - mouseX;
      let dy = btnCenterY - mouseY;
      let dist = Math.hypot(dx, dy) || 1;

      const fleePower = 140; 
      let nextLeft = (btnRect.left - zoneRect.left) + (dx / dist) * fleePower;
      let nextTop = (btnRect.top - zoneRect.top) + (dy / dist) * fleePower;

      const pad = 15;
      nextLeft = Math.max(pad, Math.min(nextLeft, zoneRect.width - btnRect.width - pad));
      nextTop = Math.max(pad, Math.min(nextTop, zoneRect.height - btnRect.height - pad));

      noBtn.style.left = nextLeft + "px";
      noBtn.style.top = nextTop + "px";
      noBtn.style.transform = "none";

      yesScale = Math.min(3, yesScale + 0.15);
      yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;

      updateQuirkyHint();
    }

    zone.addEventListener("pointermove", (e) => {
      const btnRect = noBtn.getBoundingClientRect();
      const dist = Math.hypot((btnRect.left + btnRect.width / 2) - e.clientX, (btnRect.top + btnRect.height / 2) - e.clientY);
      if (dist < 100) moveNo(e.clientX, e.clientY);
    });

    /* HOVER GIF EVENTS */
    yesBtn.addEventListener("mouseenter", () => {
      hoverGif.style.display = "block";
    });

    yesBtn.addEventListener("mouseleave", () => {
      hoverGif.style.display = "none";
    });

    noBtn.addEventListener("click", (e) => e.preventDefault());

    yesBtn.addEventListener("click", () => {
      quizContent.style.display = "none";
      result.style.display = "block";
      fireConfetti();
    });
  </script>
</body>
</html>
